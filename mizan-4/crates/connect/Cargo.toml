[package]
name = "mizan-connect"
version.workspace = true
edition.workspace = true

[dependencies]
mizan-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
log = { workspace = true }

# HTTP client (for Connect API)
reqwest = { workspace = true }
base64 = "0.22"
urlencoding = "2"

[features]
default = ["broker"]
broker = []

[dev-dependencies]
# Mock HTTP server for ConnectApiClient unit tests.
wiremock = "0.6"
# Serialise tests that mutate process-global env vars.
serial_test = "3"

# `mizan-demo-mode` CLI — flips the local install into the
# investor-pitch entitlement override. Hard-gated by
# MIZAN_ALLOW_PRODUCTION=1 inside `entitlements::demo_mode_active`
# so a stray flag in a customer build can't unlock Gold.
[[bin]]
name = "mizan-demo-mode"
path = "src/bin/mizan_demo_mode.rs"
