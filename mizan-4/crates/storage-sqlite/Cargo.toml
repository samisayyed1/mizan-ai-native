[package]
name = "mizan-storage-sqlite"
version.workspace = true
edition.workspace = true
description = "SQLite storage implementation for Mizan"
authors = ["Aziz Fadil"]
license = "AGPL-3.0"

[features]
default = []

[dependencies]
# Internal crates
mizan-core = { workspace = true }
mizan-ai = { workspace = true }
mizan-connect = { workspace = true }
mizan-device-sync = { workspace = true }
# Track H PR-H3.a — Truth Engine repository implements the trait that
# lives in mizan-financial-truth.
mizan-financial-truth = { workspace = true }

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
num-traits = { workspace = true }

# Database (SQLite/Diesel specific)
diesel = { workspace = true }
diesel_migrations = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }

# Track I PR-I5 — self_test's crypto_round_trip + truth_ledger_chain_head
# checks. Both already transit through other workspace crates; declared
# here for ownership clarity.
chacha20poly1305 = { workspace = true }
blake3 = "1"

[dev-dependencies]
tempfile = "3"
rust_decimal_macros = { workspace = true }
# Track I PR-I4 — updater_snapshot tests set artificial mtime on snapshot
# files to verify the 30-day retention janitor. `filetime` is the standard
# cross-platform way (std::fs::set_modified is unstable). Test-only dep.
filetime = "0.2"
