[package]
name = "mizan-core"
version.workspace = true
edition.workspace = true
description = "An Open Source Desktop Portfolio tracker"
authors = ["Aziz Fadil"]
license = "AGPL-3.0"
repository = "https://github.com/afadil/mizan"

[features]
default = []

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
diesel = { workspace = true }
r2d2 = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
num-traits = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }

# Sibling crates
mizan-market-data = { path = "../market-data" }
# Track H PR-H3.a — truth_engine extracted out of mizan-core into its own
# crate. activities_service depends on the public traits (TruthLedger,
# TruthLedgerRetryQueue) + types.
mizan-financial-truth = { workspace = true }
# Track H PR-H3.e — CSV parser extracted out of mizan-core. mizan-core
# depends on mizan-csv-import (not the other way round) — see ADR 0003
# and the From impl in errors.rs.
mizan-csv-import = { workspace = true }

# Additional dependencies not in workspace
yahoo_finance_api = "4.1"
regex = "1.10"
rand = { workspace = true }
rand_distr = "0.4"
rayon = "1"
urlencoding = "2"
# csv/chardetng/encoding_rs moved to mizan-csv-import in PR-H3.e — kept
# here for any remaining direct use elsewhere in mizan-core; remove in
# the next sweep once we confirm nothing else in mizan-core touches them.
csv = "1.4.0"
chardetng = "0.1"
encoding_rs = "0.8"
zip = "2.2.0"
jsonpath-rust = "0.7"
scraper = "0.22"
sha2 = "0.10"
hex = "0.4"
chrono-tz = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1.4"
# Tests in activities_service_tests wire a fake `InMemoryTruthLedger`,
# which is feature-gated in mizan-financial-truth so production binaries
# don't link it (working-agreement §17 — no test scaffolding in prod).
mizan-financial-truth = { workspace = true, features = ["test-utils"] }
