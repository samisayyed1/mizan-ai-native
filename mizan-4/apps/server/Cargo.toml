[package]
name = "mizan-server"
version.workspace = true
edition.workspace = true

[dependencies]
# Internal crates
mizan-market-data = { workspace = true }
mizan-core = { workspace = true }
mizan-connect = { workspace = true }
mizan-storage-sqlite = { workspace = true }
mizan-device-sync = { workspace = true }
mizan-ai = { workspace = true }

# Web framework
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "timeout", "request-id", "fs"] }

# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }

uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }

# Additional dependencies
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
dotenvy = "0.15"
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
serde_urlencoded = "0.7"
base64 = "0.21"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
tower_governor = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
futures-core = "0.3"
semver = "1"

[features]
default = ["connect-sync", "device-sync"]
connect-sync = []
device-sync = []

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
