[package]
name = "mizan-app"
version.workspace = true
edition.workspace = true
description = "Portfolio tracker"
authors = ["Sami Sayyed", "Aziz Fadil"]
license = "AGPL-3.0"
repository = "https://github.com/samisayyed1/mizan-4"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Internal crates
mizan-market-data = { workspace = true }
mizan-core = { workspace = true }
mizan-connect = { workspace = true }
mizan-storage-sqlite = { workspace = true }
mizan-device-sync = { workspace = true }
mizan-ai = { workspace = true }
# Track H PR-H3.a — context provider wires the retry-queue trait that
# lives in mizan-financial-truth.
mizan-financial-truth = { workspace = true }
# Track H PR-H3.b — Zakat engine extracted out of mizan-core.
mizan-zakat = { workspace = true }
# Track H PR-H3.c — Deterministic insights engine extracted out of mizan-core.
mizan-insights = { workspace = true }
# Track H PR-H3.d — Synthesis engine extracted out of mizan-core.
mizan-synthesis = { workspace = true }

# Tauri
# `devtools` enables right-click → Inspect in production builds. v3.3.1
# shipped with Connect-related runtime errors that couldn't be diagnosed
# without devtools — keeping it enabled until founding-member period
# stabilizes. Disable before Stripe / live broker launch.
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
# Native OS notifications for the wealth-insights center (Notify-1).
# macOS Notification Center / Windows Action Center / Linux freedesktop.
# Permission is requested lazily on first emit; if denied, insights
# still surface in the in-app notification center (Notify-7) so the
# user never silently misses anything.
tauri-plugin-notification = "2"

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
# Track I PR-I5.b — self_test_heartbeats uses reqwest::blocking for
# the synchronous startup probe. Layered on top of the workspace
# config (rustls-tls, json) to keep TLS choice consistent.
reqwest = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["time"] }
uuid = { workspace = true }
anyhow = { workspace = true }
diesel = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }

# Additional dependencies
dotenvy = "0.15.7"
keyring = "2.0"
base64 = "0.22"
urlencoding = "2.1.3"

# Crypto
chacha20poly1305 = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
argon2 = { workspace = true }

[features]
default = ["connect-sync", "device-sync"]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
appstore = [] # Feature flag for App Store builds
connect-sync = []
device-sync = []

[lib]
name = "mizan_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"
# Using git version for iOS camera view fix (PR #2440)
tauri-plugin-barcode-scanner = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-web-auth = "1"
tauri-plugin-mobile-share = "0.1.2"
