[workspace]
resolver = "2"
members = [
    "apps/tauri",
    "apps/server",
    "crates/*",
]

[workspace.package]
version = "3.4.1"
edition = "2021"
license = "AGPL-3.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
diesel = { version = "2.2", features = ["sqlite", "chrono", "r2d2", "numeric", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
rusqlite = { version = "0.34", features = ["bundled"] }
r2d2 = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
thiserror = "1"
anyhow = "1"

# IDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Numbers
rust_decimal = { version = "1.39", features = ["maths", "serde-float"] }
rust_decimal_macros = "1.39"
num-traits = "0.2"

# Async
async-trait = "0.1"
futures = "0.3"

# Logging
log = "0.4"

# RSS/Atom parsing (news mesh)
feed-rs = "2"

# Crypto
chacha20poly1305 = { version = "0.10", features = ["std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
# Argon2id for password-derived backup encryption keys. Defaults are
# memory-hard and resistant to GPU attacks; calibrated parameters
# live in the backup-crypto module itself.
argon2 = "0.5"

# Internal crates
mizan-market-data = { path = "crates/market-data" }
mizan-core = { path = "crates/core" }
mizan-connect = { path = "crates/connect" }
mizan-storage-sqlite = { path = "crates/storage-sqlite" }
mizan-device-sync = { path = "crates/device-sync" }
mizan-ai = { path = "crates/ai" }
# Track H PR-H3.a — Truth Engine extracted out of mizan-core into its
# own crate so the 95% coverage floor + mutation-testing rules can be
# enforced per crate (working-agreement §6).
mizan-financial-truth = { path = "crates/financial-truth" }
# Track H PR-H3.0 — cross-cutting domain types lifted out of mizan-core
# per ADR 0003. Leaf crate with no internal deps; every Track H
# extraction (zakat, insights, synthesis, csv-import) depends on this.
mizan-domain-types = { path = "crates/domain-types" }
# Track H PR-H3.b — zakat extracted out of mizan-core into its own crate
# so the 95% coverage floor + mutation-testing rules can be enforced per
# crate. mizan-zakat → mizan-core dep is temporary; PR-H3.b.1 refactors
# the API to take &[HoldingsView] slices and drops the back-edge.
mizan-zakat = { path = "crates/zakat" }
# Track H PR-H3.c — deterministic insights engine (Notify-2) extracted
# out of mizan-core. mizan-insights → mizan-core dep is temporary; the
# Notification type lifts to mizan-domain-types in PR-H3.c.1.
mizan-insights = { path = "crates/insights" }
