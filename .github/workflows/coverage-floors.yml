name: Coverage Floors

# Hard-gate line coverage on the financial-truth, zakat, csv-import,
# and domain-types crates per CLAUDE.md §0 + working-agreement §5.
#
# Floors (from working-agreement §5):
#   financial-truth → 95%
#   zakat           → 95%
#   csv-import      → 90%
#   domain-types    → 90%
#
# Design notes:
#
# 1. cargo-llvm-cov's TOTAL line in `--summary-only` aggregates across
#    EVERY file instrumented in the binary, not just the target
#    crate. With `--package mizan-zakat` the binary still pulls in
#    mizan-core, market-data, etc. — so the TOTAL is dominated by
#    un-targeted crates and the `--fail-under-lines` flag fires
#    falsely. We use `--json` + Python to compute the per-crate total.
# 2. GitHub Actions matrix-level `if:` has stricter expression rules
#    than I'd like — dynamic bracket access on outputs is forbidden,
#    and multi-line / single-line conditionals against `needs.*` in a
#    matrix context produced "workflow file issue" runs. So each
#    gated crate is its own job. Verbose but bulletproof.
# 3. The detect-changes job emits one boolean per gated crate via
#    dorny/paths-filter so a PR touching only domain-types triggers
#    only the domain-types gate.

on:
  pull_request:
    branches: [main]
    paths:
      - 'mizan-4/crates/financial-truth/**'
      - 'mizan-4/crates/zakat/**'
      - 'mizan-4/crates/csv-import/**'
      - 'mizan-4/crates/domain-types/**'
      - '.github/workflows/coverage-floors.yml'
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: detect changed gated crates
    runs-on: ubuntu-latest
    outputs:
      financial-truth: ${{ steps.filter.outputs.financial-truth }}
      zakat: ${{ steps.filter.outputs.zakat }}
      csv-import: ${{ steps.filter.outputs.csv-import }}
      domain-types: ${{ steps.filter.outputs.domain-types }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            financial-truth:
              - 'mizan-4/crates/financial-truth/**'
            zakat:
              - 'mizan-4/crates/zakat/**'
            csv-import:
              - 'mizan-4/crates/csv-import/**'
            domain-types:
              - 'mizan-4/crates/domain-types/**'

  financial-truth:
    name: mizan-financial-truth ≥ 95%
    needs: detect-changes
    if: needs.detect-changes.outputs.financial-truth == 'true'
    uses: ./.github/workflows/coverage-floors-job.yml
    with:
      crate: mizan-financial-truth
      slug: financial-truth
      floor: 95

  zakat:
    name: mizan-zakat ≥ 95%
    needs: detect-changes
    if: needs.detect-changes.outputs.zakat == 'true'
    uses: ./.github/workflows/coverage-floors-job.yml
    with:
      crate: mizan-zakat
      slug: zakat
      floor: 95

  csv-import:
    name: mizan-csv-import ≥ 90%
    needs: detect-changes
    if: needs.detect-changes.outputs.csv-import == 'true'
    uses: ./.github/workflows/coverage-floors-job.yml
    with:
      crate: mizan-csv-import
      slug: csv-import
      floor: 90

  domain-types:
    name: mizan-domain-types ≥ 90%
    needs: detect-changes
    if: needs.detect-changes.outputs.domain-types == 'true'
    uses: ./.github/workflows/coverage-floors-job.yml
    with:
      crate: mizan-domain-types
      slug: domain-types
      floor: 90
