name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      mizan4: ${{ steps.filter.outputs.mizan4 }}
      connect: ${{ steps.filter.outputs.connect }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mizan4:
              - 'mizan-4/**'
              - '.github/workflows/ci.yml'
            connect:
              - 'mizan-connect/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: mizan-4 frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.mizan4 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: mizan-4/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend type-check
      - run: pnpm --filter frontend lint:quiet
      - run: pnpm --filter frontend test -- --run
      - run: pnpm --filter frontend build

  mizan4-rust:
    name: mizan-4 rust
    needs: detect-changes
    if: needs.detect-changes.outputs.mizan4 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mizan-4
      - name: Install linux deps for tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib

  connect-rust:
    name: mizan-connect rust
    needs: detect-changes
    if: needs.detect-changes.outputs.connect == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-connect
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan
          POSTGRES_DB: mizan_connect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mizan -d mizan_connect"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mizan:mizan@localhost:5432/mizan_connect
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mizan-connect
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib

  connect-docker:
    name: mizan-connect docker
    needs: detect-changes
    if: needs.detect-changes.outputs.connect == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mizan-connect
          push: false
          tags: mizan-connect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Apple-grade: surface every new RustSec advisory in both projects on
  # every PR. Known-accepted advisories are recorded in each project's
  # `.cargo/audit.toml` so a future contributor can see the rationale
  # without re-deriving it. Anything not in those files that audit flags
  # is a real failure that must be fixed (or explicitly added with a
  # documented reason).
  cargo-audit:
    name: cargo audit (mizan-4 + mizan-connect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit mizan-4
        working-directory: mizan-4
        # mizan-4's audit-config is committed in `.cargo/audit.toml`
        # (or per-call --ignore). Currently we have zero accepted
        # advisories — every flagged advisory is a real failure.
        run: cargo audit --deny warnings --deny unmaintained
      - name: Audit mizan-connect
        working-directory: mizan-connect
        # Known-accepted: see mizan-connect/.cargo/audit.toml. The
        # ignore list is passed explicitly so the CI is reproducible
        # even on cargo-audit versions that don't read the per-project
        # config file (older versions only honour ~/.cargo/audit.toml).
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0111 \
            --deny warnings
