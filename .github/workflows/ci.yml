name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      mizan4: ${{ steps.filter.outputs.mizan4 }}
      connect: ${{ steps.filter.outputs.connect }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mizan4:
              - 'mizan-4/**'
              - '.github/workflows/ci.yml'
            connect:
              - 'mizan-connect/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: mizan-4 frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.mizan4 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup reads `packageManager` from the repo-root
          # package.json. The Mizan monorepo's package.json lives at
          # mizan-4/package.json, so we declare the version explicitly
          # here. Keep this in sync with mizan-4/package.json's
          # `packageManager` field on bumps.
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: mizan-4/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The frontend depends on @mizan/ui's compiled type declarations
      # in packages/ui/dist/. Build types across all workspace packages
      # before type-check so tsc finds the .d.ts files (otherwise TS6305
      # fires on every `@mizan/ui` import).
      - run: pnpm -r run build:types
      - run: pnpm --filter frontend type-check
      - run: pnpm --filter frontend lint:quiet
      - run: pnpm --filter frontend test -- --run
      - run: pnpm --filter frontend build

  mizan4-rust:
    name: mizan-4 rust
    needs: detect-changes
    if: needs.detect-changes.outputs.mizan4 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mizan-4
      - name: Install linux deps for tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib

  connect-rust:
    name: mizan-connect rust
    needs: detect-changes
    if: needs.detect-changes.outputs.connect == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-connect
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan
          POSTGRES_DB: mizan_connect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mizan -d mizan_connect"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mizan:mizan@localhost:5432/mizan_connect
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mizan-connect
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib

  connect-docker:
    name: mizan-connect docker
    needs: detect-changes
    if: needs.detect-changes.outputs.connect == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mizan-connect
          push: false
          tags: mizan-connect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Apple-grade: surface every new RustSec advisory in both projects on
  # every PR. Known-accepted advisories are recorded in each project's
  # `.cargo/audit.toml` so a future contributor can see the rationale
  # without re-deriving it. Anything not in those files that audit flags
  # is a real failure that must be fixed (or explicitly added with a
  # documented reason).
  cargo-audit:
    name: cargo audit (mizan-4 + mizan-connect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit mizan-4
        working-directory: mizan-4
        # mizan-4's audit-config is committed in `.cargo/audit.toml` —
        # 15 unmaintained advisories on transitive gtk-rs 0.18.x + utility
        # crates pulled in by Tauri 2's Linux backend. See audit.toml for
        # the full rationale and the re-evaluation trigger (Tauri 3 or
        # the upstream GTK4 migration).
        #
        # `--ignore` flags are explicit here so the CI is reproducible
        # across cargo-audit versions (older versions only honour
        # ~/.cargo/audit.toml, not per-project config).
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0411 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0414 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0417 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2024-0429 \
            --deny warnings
      - name: Audit mizan-connect
        working-directory: mizan-connect
        # Known-accepted: see mizan-connect/.cargo/audit.toml. The
        # ignore list is passed explicitly so the CI is reproducible
        # even on cargo-audit versions that don't read the per-project
        # config file (older versions only honour ~/.cargo/audit.toml).
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0111 \
            --ignore RUSTSEC-2025-0134 \
            --deny warnings

  # Track H §18.1/§18.2/§18.4 hygiene: dead code, dead files, dead deps,
  # secret scan. Soft-fail mode (informational warnings only) until the
  # baseline audit pass classifies findings. Promoted to hard-fail in
  # PR-H9 after findings are resolved.
  hygiene:
    name: code hygiene scan (informational)
    runs-on: ubuntu-latest
    # Run on every push/PR; never blocks merge yet (continue-on-error).
    # PR-H9 of Track H removes the continue-on-error after the baseline
    # audit signs off.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history

      # Secret scan over full history (working agreement §18.12 baseline req)
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # Dead-dependency scan for Rust (working agreement §18.4)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-machete
        run: cargo install --locked cargo-machete
      - name: Machete mizan-4
        working-directory: mizan-4
        run: cargo machete --skip-target-dir || true
      - name: Machete mizan-connect
        working-directory: mizan-connect
        run: cargo machete --skip-target-dir || true

      # Dead-export scan for TypeScript (working agreement §18.1)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: mizan-4/pnpm-lock.yaml
      - name: pnpm install
        working-directory: mizan-4
        run: pnpm install --frozen-lockfile
      - name: knip
        working-directory: mizan-4
        # Knip needs config; run with default rules and report-only. The
        # frontend package.json adds a "knip" script in PR-H6.b that
        # configures the project boundaries; until then, this is a smoke
        # test that knip can parse the project.
        run: pnpm dlx knip --no-exit-code --include exports || true
      - name: ts-prune
        working-directory: mizan-4/apps/frontend
        run: pnpm dlx ts-prune --error 0 || true

      # Cache-policy registration lint (Track I PR-I1.b).
      # Every cache-shaped table in the schema must declare its TTL +
      # eviction policy in `crates/storage-sqlite/src/cache_policy.rs::CACHE_POLICIES`.
      # See ADR 0008.
      - name: cache-policy registration lint
        run: ./scripts/lint-cache-policy.sh

      # No-f64-in-money-paths lint (Track H PR-H8.b).
      # Working agreement §0 + §13 (QA Pass 4 past-bug). `rust_decimal::Decimal`
      # is mandatory in money paths. The lint catches `f64` in directories
      # that handle money. Initial run surfaces health-checks findings —
      # those are captured in the 2026-Q3 baseline audit (Track H PR-H9).
      - name: no-f64-in-money-paths lint
        run: ./scripts/lint-no-f64-in-money-paths.sh

      # Migration cache-eviction manifest lint (Track I PR-I2.d).
      # Per ADR 0008 + working-agreement §19.2, every migration ≥ 2026-06-02
      # must carry a `-- caches-evicted:` manifest comment.
      - name: migration cache-manifest lint
        run: ./scripts/lint-migration-cache-manifest.sh
